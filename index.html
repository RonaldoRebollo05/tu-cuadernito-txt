<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cuadernito - Gestión para tu negocio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .container {
            max-width: 600px;
            padding: 2.5rem;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h1 {
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        p {
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            background-color: #e0f2fe;
            color: #0369a1;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .links {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.95rem;
        }
        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Tu Cuadernito</h1>
        <p>Tu aliado contable y de inventario para pequeños negocios y emprendedores. Simple, rápido y seguro.</p>
        <div class="badge">Disponible en Google Play</div>
        <div class="links">
            <a href="https://sites.google.com/view/tu-cuadernito" target="_blank">Política de Privacidad</a>
            <a href="app-ads.txt" target="_blank">app-ads.txt</a>
        </div>
    </div>
</body>
</html>
